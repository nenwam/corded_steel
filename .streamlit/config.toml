# Deliberately NO [theme] block.
#
# Streamlit treats any [theme] entry — even a fonts-only one — as an
# authoritative "Custom Theme" and then ignores the viewer's own theme choice.
# That would break the Blackout/Daylight button, which works by storing one of
# Streamlit's presets. So the colour scheme comes from the Dark preset, and
# everything else (fonts, case, hazard stripes, the red accent, square corners)
# is CSS in style.py, which applies in both modes.
[browser]
gatherUsageStats = false
